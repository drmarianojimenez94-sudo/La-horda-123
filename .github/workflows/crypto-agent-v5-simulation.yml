name: CryptoAgent V5 Historical Simulation
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Historical 5-minute candles (365 days; 4x the original 90-day baseline)'
        required: true
        type: choice
        default: '365'
        options:
          - '365'
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run V5 unit and integration tests
        run: |
          python -m unittest discover -s crypto-agent -p 'test_engine_v5.py' -v
          python -m unittest discover -s crypto-agent -p 'test_backtest_v5.py' -v
          python -m unittest discover -s crypto-agent -p 'test_meta_v5.py' -v
          python -m unittest discover -s crypto-agent -p 'test_diagnostics_v5.py' -v
          python -m unittest discover -s crypto-agent -p 'test_training_memory_v5.py' -v
          python -m unittest discover -s crypto-agent -p 'test_champion_v5.py' -v
          python -m unittest discover -s crypto-agent -p 'test_economic_learning_v5.py' -v
      - name: Download historical crypto market data
        run: python crypto-agent/download_5m.py --days ${{ inputs.days }}
      - name: Train specialists and evaluate independent walk-forward windows
        run: python crypto-agent/walkforward_v5.py
      - name: Upload downloadable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-agent-v5-simulation-results
          path: |
            crypto-agent/audit_v5_walkforward.json
          if-no-files-found: warn
          retention-days: 90
      - name: Archive immutable training report in repository
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crypto-agent/training_memory_v5.py --report crypto-agent/audit_v5_walkforward.json --days ${{ inputs.days }}
