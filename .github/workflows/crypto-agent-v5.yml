name: CryptoAgent V5 Engine Quality Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crypto-agent/**'
      - '.github/workflows/crypto-agent-v5.yml'
jobs:
  engine-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test accounting and partial fills
        run: python -m unittest discover -s crypto-agent -p 'test_engine_v5.py' -v
