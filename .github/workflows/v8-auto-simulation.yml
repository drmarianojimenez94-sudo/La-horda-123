name: V8 Automatic Strategy Simulation
on:
  push:
    branches: [main]
    paths:
      - 'crypto-agent/v8_strategy_research.py'
      - 'crypto-agent/test_v8_strategy_research.py'
      - 'crypto-agent/v8_channel_portfolio.py'
      - 'crypto-agent/v8_channel_signals.py'
      - 'crypto-agent/v8_shared_portfolio.py'
      - '.github/workflows/v8-auto-simulation.yml'
  workflow_dispatch:
concurrency:
  group: v8-simulation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and V8 regression
        run: |
          python -m compileall -q crypto-agent
          python -m unittest discover -s crypto-agent -p 'test_v8_strategy_research.py' -v
          python -m unittest discover -s crypto-agent -p 'test_v8_leverage_policy.py' -v
          python -m unittest discover -s crypto-agent -p 'test_v8_margin_ledger.py' -v
          python -m unittest discover -s crypto-agent -p 'test_v8_margin_comparison.py' -v
          python -m unittest discover -s crypto-agent -p 'test_v8_channel*.py' -v
          python -m unittest discover -s crypto-agent -p 'test_v8_unified.py' -v
      - name: Restore prior research memory
        uses: actions/cache/restore@v4
        with:
          path: crypto-agent/state/v8-research.sqlite3
          key: v8-research-${{ github.run_id }}
          restore-keys: |
            v8-research-
      - name: Download 90 days real BTC and ETH
        run: python crypto-agent/download_5m.py --days 90 --symbols BTCUSDT,ETHUSDT
      - name: Simulate all 50 hypotheses
        run: python crypto-agent/v8_strategy_research.py
      - name: Test shared-capital channel breakouts
        run: python crypto-agent/v8_channel_portfolio.py
      - name: Audit and archive V8 model selection
        run: python crypto-agent/v8_economic_audit.py
      - name: Save immutable research memory snapshot
        uses: actions/cache/save@v4
        if: success()
        with:
          path: crypto-agent/state/v8-research.sqlite3
          key: v8-research-${{ github.run_id }}
      - name: Analyze historical price behaviour
        run: python crypto-agent/v8_price_behaviour.py
      - name: Upload V8 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-50-strategy-results
          path: |
            crypto-agent/v8-strategy-research.json
            crypto-agent/v8-price-behaviour.json
            crypto-agent/v8-channel-portfolio.json
            crypto-agent/v8-economic-audit.json
            crypto-agent/state/v8-research.sqlite3
          if-no-files-found: warn
          retention-days: 90
